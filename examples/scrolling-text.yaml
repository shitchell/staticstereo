# Text wider than the frame, scrolling right to left.
#
# `marquee` measures the real rendered text width, so an over-wide string
# leaves the frame completely instead of parking its tail on screen.
#
#   stst render examples/scrolling-text.yaml -o text.gif
#
# The type is deliberately LARGE and BOLD, and that is not a style choice. A
# feature narrower than the disparity budget (sepFar - sepNear = 18px) cannot
# carry an unambiguous shift, so it will not fuse. Measured median stroke
# widths in the stock sans:
#
#     normal  90px ->  10px stroke   will not fuse
#     normal 150px ->  17px stroke   will not fuse
#     bold   240px ->  57px stroke   readable
#     bold   360px ->  84px stroke   comfortable
#
# Weight saturates: `900` renders identically to `bold` here. Past that, only
# size helps -- or widen sepNear to shrink the budget and buy legibility at the
# cost of depth range.

size: [800, 300]
fps: 12
duration: 6
layers:
  - type: text
    text: STATIC ON THE STEREO
    size: 240
    weight: bold
    at: [0, 30]
    depth: 0.65
    anim: {kind: marquee, speed: 220}

# Text wider than the frame, scrolling right to left.
#
# `marquee` measures the real rendered text width, so an over-wide string
# leaves the frame completely instead of parking its tail on screen.
#
#   stst render examples/scrolling-text.yaml -o text.gif
#
# The type is deliberately LARGE and BOLD, and that is not a style choice. A
# feature narrower than the disparity budget (sepFar - sepNear = 18px) cannot
# carry an unambiguous shift, so it will not fuse. Median width of the
# horizontal runs of depth-map samples at or above half the layer's peak depth,
# measured on DejaVu Sans -- which is what the Node adapter resolves
# `sans-serif` to:
#
#     normal  48px ->   6px stroke   will not fuse  (48px is the DEFAULT)
#     normal  90px ->  10px stroke   will not fuse
#     normal 150px ->  16px stroke   will not fuse
#     bold    90px ->  18px stroke   exactly the budget; hard work
#     bold   150px ->  29px stroke   over the budget, under 2x it
#     bold   240px ->  46px stroke   comfortable      <-- what this scene uses
#     bold   360px ->  68px stroke   comfortable
#
# Past bold, a heavier weight is synthesised rather than selected: DejaVu Sans
# and Liberation Sans declare only 400 and 700 faces, Chromium renders `900`
# byte-identically to `bold` in both, and @napi-rs/canvas fakes it at +13-25%.
# So `900` is worth between nothing and a fifth depending on the rasteriser.
# Size always works. Alternatively widen sepNear to shrink the budget, buying
# legibility at the cost of depth range.

size: [800, 300]
fps: 12
duration: 6
layers:
  - type: text
    text: STATIC ON THE STEREO
    size: 240
    weight: bold
    at: [0, 30]
    depth: 0.65
    anim: {kind: marquee, speed: 220}

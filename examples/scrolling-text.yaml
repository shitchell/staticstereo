# Text wider than the frame, scrolling right to left.
#
# A `move` with a `speed` and `repeat: loop`. This was a `marquee`, which
# derived the same two endpoints from the compile context; `marquee` is gone
# (design 4.2b narrows the registry to five verbs), but the derivation came
# back with it: `move`'s `from`/`to` take the off-stage endpoints as tokens,
# so this file names them instead of carrying their arithmetic. See the
# `anim:` block at the bottom.
#
#   stst render examples/scrolling-text.yaml -o text.gif
#
# The type is deliberately LARGE and BOLD, and that is not a style choice. A
# feature narrower than the disparity budget (sepFar - sepNear = 18px) cannot
# carry an unambiguous shift, so it will not fuse. Median width of the
# horizontal runs of depth-map samples at or above half the layer's peak depth,
# measured on the vendored face (assets/fonts/inter-*, which both the CLI and
# the website rasterise -- so these numbers hold on either):
#
#     normal  48px ->   5px stroke   will not fuse  (48px is the DEFAULT)
#     normal  90px ->   9px stroke   will not fuse
#     normal 150px ->  15px stroke   will not fuse
#     normal 182px ->  18px stroke   exactly the budget; hard work
#     bold    90px ->  14px stroke   will not fuse (this is --text's default)
#     bold   110px ->  18px stroke   exactly the budget; hard work
#     bold   150px ->  24px stroke   over the budget, under 2x it
#     bold   240px ->  37px stroke   comfortable      <-- what this scene uses
#     bold   360px ->  55px stroke   comfortable
#     900     83px ->  18px stroke   exactly the budget; hard work
#     900     90px ->  19px stroke   just over the budget
#     900    240px ->  50px stroke   comfortable
#
# All twelve rows are hand-maintained and were NOT reproduced in this phase --
# they are dated to the vendored face above; re-measuring them needs a harness
# (stroke legibility is design 10.3's, not this phase's).
#
# Past bold there is now a real 900 face, which there was not before: the
# system fonts this used to fall back on (DejaVu Sans, Liberation Sans, Noto
# Sans) declare only 400 and 700, Chromium rendered `900` byte-identically to
# `bold` in all three, and @napi-rs/canvas faked it at +13-25%. The vendored
# family declares 400, 700 AND 900, so `900` is worth about +35% over bold in
# both rasterisers. Size still has the widest range. Alternatively raise
# sepNear to shrink the budget, buying legibility at the cost of depth range.

size: [800, 300]
fps: 12
duration: 6
layers:
  - type: text
    text: STATIC ON THE STEREO
    size: 240
    weight: bold
    at: [0, 30]
    depth: 0.65
    # `offRight` and `offLeft` are resolved out of the compile context by
    # `move` itself (design 4.2), and they are against the PLATE, not the
    # stage: `sceneW + marginRight` near side, `-(contentW + marginLeft)` far
    # side. So "off-frame" means off the image that is actually emitted, and
    # `speed` is px/sec across the whole of it. The far endpoint runs past
    # `-contentW` rather than stopping at 0, which would park the tail of an
    # over-wide string on screen forever.
    #
    # WHY TOKENS AND NOT THE TWO NUMBERS: `contentW` is the MEASURED width of
    # the rendered string on the vendored face, so the far endpoint is a
    # function of the text, the size, the weight and the face. As a literal it
    # went stale the moment any of those changed, and a stale far endpoint
    # parks the tail on screen again -- the bug `-contentW` exists to prevent.
    # As a token it cannot go stale and nothing here is recomputed by hand.
    #
    # AND A WRONG FAR ENDPOINT WOULD NOT SHOW UP IN THIS SCENE'S OUTPUT, which
    # is the part worth knowing. The ease is linear and `speed` sets
    # `duration = travel / speed`, so inside the move the position is
    # `x(s) = from - speed*s`: `to` cancels out of every rendered position and
    # survives only in the duration. The derived move is ~17s and the scene is
    # 6s, so every frame emitted is strictly inside it. Verified by rendering
    # this file: substituting `to: [-2000, 0]` or `to: [-9999, 0]` for the
    # token leaves all 72 frames byte-identical. That check is not vacuous --
    # `to: [-100, 0]` shortens the move to 4.34s and does change 19 frames --
    # but the break-even is about -447, so any endpoint beyond it, right or
    # wrong, renders the same picture. This is the mechanism by which the
    # website's copy of this scroll carried a `to` that was 17.33px short of
    # clearing the plate for several commits with nothing red and nothing
    # visibly wrong (see `site/examples.ts`; `raster.test.ts` pins the
    # duration-to-scene ratio that makes it so for all three scrolls). So the
    # token is not merely tidier than a correct number: a correct number here
    # would be unfalsifiable, and that is the whole argument for deriving it.
    #
    # Measured at the commit that landed the tokens and recomputed at the one
    # that wrote the paragraph above -- same values both times, but they are a
    # snapshot of a derived quantity rather than a property of this file, so
    # recompute before citing them: the tokens resolve to 855 and
    # -2885.550048828125, byte-for-byte the two literals this file used to
    # spell out, so the swap moved no pixel. Travel 3740.550048828125px at
    # 220px/s derives a 17.002500221946022s move.
    anim:
      - kind: move
        from: [offRight, 0]
        to: [offLeft, 0]
        speed: 220
        repeat: loop

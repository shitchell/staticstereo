# A ball crossing the frame while bouncing.
#
# Two animators on ONE layer: a `move` and a raw keyframe track compose, so
# their translations sum -- which is why there is no `move-with-bounce` preset.
#
# The second animator was a `bounce` preset, which is gone (design 4.2b narrows
# the registry to five verbs). It is written out as the track it compiled to,
# not re-expressed with `move`: a bounce is a THREE-key arc and `move` has two,
# and two stacked `move`s would SUM rather than sequence, which is a different
# animation. A raw track is a first-class animator -- `Anim` is
# `Track | Preset | (Track | Preset)[]` -- and 4.2b makes the presets UI
# templates that emit exactly this.
#
# Note the ball is a `shape`, not a PNG. Every example here is authorable in
# text so a reviewer can read the scene in a diff.
#
#   stst render examples/bouncing-ball.yaml -o ball.gif
#
# Known wart (design 4.1): easing is per-segment, so the three-key bounce eases
# the RISE as well as the fall. Fixing it needs per-key easing, a schema change.

size: [800, 300]
fps: 12
duration: 4
layers:
  - type: shape
    shape: circle
    r: 46
    # `at` for a circle is its CENTRE, in STAGE coordinates (design 10): the
    # stage is the region that survives fusion, and `size:` above is the stage.
    # The dead columns the encoder cannot express now live OUTSIDE the stage, in
    # the plate's margins, so x=140 is no longer load-bearing -- x=0 would be
    # encoded too. The emitted PNG is wider than 800px by design; `stst` prints
    # `stage 800x300 -> plate 965x300` so the difference is not a surprise.
    at: [140, 190]
    depth: 1.0
    anim:
      - {kind: move, from: [0, 0], to: [520, 0]}
      # Up 150px and back down, once a second, forever. Compiled from the live
      # `bounce {height: 150, duration: 1.0}` rather than reconstructed by
      # hand, so this is byte-for-byte the track that was rendering before.
      - keys:
          - {t: 0, y: 0}
          - {t: 0.5, y: -150}
          - {t: 1, y: 0}
        ease: easeOutBounce
        repeat: loop
        duration: 1.0
